services:
  - type: web
    name: plotismarta
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: DATA_DIR
        value: /app/data
      - key: STATIC_DIR
        value: /app/dist
      - key: GEMINI_API_KEY
        sync: false
